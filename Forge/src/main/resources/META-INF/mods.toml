[[mods]]
modId="geckolib3"
version="${file.jarVersion}" 
displayName="GeckoLib (Refined)"
displayURL="https://github.com/Vonix-Network/GeckoLib-Refined"
logoFile="geckolib.png" 
credits="Gecko, Eliot, AzureDoom, DerToaster, Tslat (upstream); Vonix Network (Refined fork)" 
authors="Gecko, Eliot, AzureDoom, Chappie, DerToaster, Tslat; Vonix Network (Refined fork maintainer)"
description='''
GeckoLib is an animation engine for Minecraft Mods, with support for complex 3D keyframe-based animations, 30+ easings, concurrent animation support, sound and particle keyframes, event keyframes, and more.

This is the Refined community-maintenance fork for the abandoned 1.19.2 branch. Drop-in compatible with all geckolib3 mods (same modid, same package, same API). See https://github.com/Vonix-Network/GeckoLib-Refined for changelog and provenance.
'''
[[dependencies.geckolib3]]
    modId="forge"
    mandatory=true 
    versionRange="[41.0.98,)"
    ordering="NONE"
    side="BOTH"
